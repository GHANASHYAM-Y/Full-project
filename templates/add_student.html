<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Add Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container my-4">
  <div class="card p-4 shadow-sm">
    <h4>Add New Student</h4>
    <form id="studentForm" class="mt-3">
      <div class="mb-3">
        <label class="form-label">Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Roll Number</label>
        <input type="text" class="form-control" id="roll" name="roll" placeholder="e.g., CS101">
        <small class="text-muted">Must be unique</small>
      </div>
      <div class="mb-3">
        <label class="form-label">Department</label>
        <select class="form-select" id="department" name="department">
          <option value="">Select Department</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Mechanical Engineering">Mechanical Engineering</option>
          <option value="Civil Engineering">Civil Engineering</option>
          <option value="Electrical Engineering">Electrical Engineering</option>
          <option value="Electronics & Communication">Electronics & Communication</option>
          <option value="Information Technology">Information Technology</option>
          <option value="Chemical Engineering">Chemical Engineering</option>
          <option value="Biotechnology">Biotechnology</option>
          <option value="Aeronautical Engineering">Aeronautical Engineering</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Section</label>
        <input type="text" class="form-control" id="section" name="section" placeholder="e.g., A, B, C" maxlength="5">
      </div>
      <button type="submit" class="btn btn-primary">Save & Capture Face</button>
    </form>

    <div id="cameraSection" class="mt-4" style="display:none;">
      <h5>Capture Face Images (Step 2)</h5>
      <p class="text-muted">Capture 30-50 images from different angles for better accuracy</p>
      <div class="row">
        <div class="col-md-8">
          <video id="video" width="640" height="480" autoplay muted style="border-radius:10px;border:2px solid #e2e8f0;"></video>
          <div class="mt-2">
            <button id="startBtn" class="btn btn-success">Start Camera</button>
            <button id="captureBtn" class="btn btn-primary" disabled>Capture (<span id="count">0</span>)</button>
            <button id="uploadBtn" class="btn btn-info" disabled>Upload Images</button>
          </div>
        </div>
        <div class="col-md-4">
          <h6>Captured Images</h6>
          <div id="gallery" class="d-flex flex-wrap gap-2"></div>
        </div>
      </div>
      <div id="uploadStatus" class="mt-2"></div>
    </div>
  </div>
</div>

<script>
const form = document.getElementById('studentForm');
const cameraSection = document.getElementById('cameraSection');
const video = document.getElementById('video');
const startBtn = document.getElementById('startBtn');
const captureBtn = document.getElementById('captureBtn');
const uploadBtn = document.getElementById('uploadBtn');
const gallery = document.getElementById('gallery');
const countSpan = document.getElementById('count');
const uploadStatus = document.getElementById('uploadStatus');

let studentId = null;
let stream = null;
let capturedBlobs = [];

// Save student metadata
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(form);
  
  try {
    const res = await fetch('/add_student', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    
    if (data.error) {
      alert('Error: ' + data.error);
      return;
    }
    
    studentId = data.student_id;
    alert('Student saved! Now capture face images.');
    form.style.display = 'none';
    cameraSection.style.display = 'block';
  } catch (err) {
    alert('Error saving student: ' + err.message);
  }
});

// Start camera
startBtn.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    video.srcObject = stream;
    startBtn.disabled = true;
    captureBtn.disabled = false;
  } catch (err) {
    alert('Camera error: ' + err.message);
  }
});

// Capture image
captureBtn.addEventListener('click', () => {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  
  canvas.toBlob((blob) => {
    capturedBlobs.push(blob);
    
    // Show thumbnail
    const img = document.createElement('img');
    img.src = URL.createObjectURL(blob);
    img.style.width = '80px';
    img.style.height = '60px';
    img.style.borderRadius = '5px';
    img.style.border = '2px solid #ddd';
    gallery.appendChild(img);
    
    countSpan.textContent = capturedBlobs.length;
    
    if (capturedBlobs.length >= 5) {
      uploadBtn.disabled = false;
    }
  }, 'image/jpeg', 0.95);
});

// Upload images
uploadBtn.addEventListener('click', async () => {
  if (capturedBlobs.length < 5) {
    alert('Capture at least 5 images');
    return;
  }
  
  uploadBtn.disabled = true;
  uploadStatus.textContent = 'Uploading...';
  uploadStatus.className = 'alert alert-info';
  
  const formData = new FormData();
  formData.append('student_id', studentId);
  capturedBlobs.forEach((blob, i) => {
    formData.append('images[]', blob, `face_${i}.jpg`);
  });
  
  try {
    const res = await fetch('/upload_face', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    
    uploadStatus.textContent = `✓ ${data.saved} images uploaded successfully! Now train the model.`;
    uploadStatus.className = 'alert alert-success';
    
    setTimeout(() => {
      window.location.href = '/';
    }, 2000);
  } catch (err) {
    uploadStatus.textContent = 'Upload failed: ' + err.message;
    uploadStatus.className = 'alert alert-danger';
    uploadBtn.disabled = false;
  }
});
</script>
</body>
</html>
